<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Denali GPU Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #161b22;
    --panel-2: #1c232c;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }
  .meta { color: var(--muted); font-size: 13px; }
  .toolbar {
    margin-left: auto;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .btn:hover { background: var(--panel-2); }
  .btn.active {
    background: var(--accent);
    color: #0a0e13;
    border-color: var(--accent);
  }
  main { padding: 24px 28px 60px; }
  .host-section { margin-bottom: 40px; }
  .host-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .host-header h2 { margin: 0; font-size: 18px; }
  .host-header .stat { color: var(--muted); font-size: 13px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h3 {
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .chart-wrap { position: relative; height: 280px; }
  .chart-wrap.tall { height: 360px; }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } }
  .gpu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  .gpu-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .gpu-card .row { display: flex; justify-content: space-between; gap: 8px; }
  .gpu-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .gpu-card .users { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .user-chip {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    color: #0a0e13;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    vertical-align: middle;
    margin-right: 5px;
  }
  .util-bar {
    height: 6px;
    background: #232a35;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .util-bar > span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #2ea043, #d29922 60%, #f85149 90%);
    transition: width 0.3s;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 40px;
    font-size: 14px;
  }
  footer {
    color: var(--muted);
    font-size: 12px;
    padding: 0 28px 24px;
  }
</style>
</head>
<body>

<header>
  <h1>Denali GPU Monitor</h1>
  <span class="meta" id="generatedAt">loading...</span>
  <div class="toolbar" id="rangeBtns">
    <button class="btn" data-hours="1">Last hour</button>
    <button class="btn active" data-hours="24">24 hours</button>
    <button class="btn" data-hours="168">Week</button>
    <button class="btn" data-hours="720">Month</button>
  </div>
</header>

<main id="main">
  <div class="empty" id="emptyMsg">Loading data...</div>
</main>

<footer>
  Samples every <span id="intervalLabel">10</span> min ·
  data file: <code>data.json</code> ·
  refresh page to update
</footer>

<script>
// ---------- color assignment ----------
// Stable color per username via hash → HSL. Returns hsl(...) or hsla(...).
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h * 31 + s.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}
const _userColorParams = {};
function userColorHSL(user) {
  if (_userColorParams[user]) return _userColorParams[user];
  const h = hashStr(user);
  _userColorParams[user] = {
    hue: h % 360,
    sat: 55 + (h % 25),
    light: 60 + ((h >> 3) % 12),
  };
  return _userColorParams[user];
}
const UNUSED_COLOR_RGB = "110, 118, 129";  // grey
function userColor(user, alpha = 1) {
  if (!user || user === "unknown" || user === "idle") {
    return alpha < 1 ? `rgba(${UNUSED_COLOR_RGB}, ${alpha})` : "#3a4250";
  }
  const { hue, sat, light } = userColorHSL(user);
  return alpha < 1
    ? `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`
    : `hsl(${hue}, ${sat}%, ${light}%)`;
}

// ---------- helpers ----------
function fmtTs(iso) {
  return new Date(iso).toLocaleString([], {
    month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit",
  });
}

function filterRange(data, hours) {
  const now = Date.now();
  const cutoff = now - hours * 3600000;
  const idxs = [];
  data.timestamps.forEach((t, i) => {
    if (new Date(t).getTime() >= cutoff) idxs.push(i);
  });
  return idxs;
}

function rangeLabel(hours) {
  if (hours < 24) return `${hours} hour${hours === 1 ? "" : "s"}`;
  const days = hours / 24;
  return `${days} day${days === 1 ? "" : "s"}`;
}

function avg(arr) {
  const valid = arr.filter(v => v != null);
  if (!valid.length) return null;
  return valid.reduce((a, b) => a + b, 0) / valid.length;
}

// ---------- chart builders ----------
let charts = [];
function destroyCharts() {
  charts.forEach(c => c.destroy());
  charts = [];
}

function windowBounds(hours) {
  const now = Date.now();
  return { xMin: now - hours * 3600000, xMax: now };
}

function buildUtilChart(canvas, host, idxs, hours) {
  const tsAll = window._data.timestamps;
  const { xMin, xMax } = windowBounds(hours);
  // Use {x, y} points so the time scale honors min/max even when there's no
  // data near either edge of the window.
  const datasets = [];
  for (let g = 0; g < host.num_gpus; g++) {
    datasets.push({
      label: `GPU ${g}`,
      data: idxs.map(i => ({ x: new Date(tsAll[i]).getTime(), y: host.util[i]?.[g] ?? null })),
      borderColor: `hsl(${(g * 47) % 360}, 70%, 65%)`,
      backgroundColor: `hsl(${(g * 47) % 360}, 70%, 65%, 0.1)`,
      borderWidth: 1.5,
      pointRadius: 0,
      tension: 0.2,
      spanGaps: true,
    });
  }
  const c = new Chart(canvas, {
    type: "line",
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: false,
      interaction: { mode: "index", intersect: false },
      scales: {
        x: {
          type: "time",
          min: xMin, max: xMax,
          time: { tooltipFormat: "MMM d, HH:mm" },
          ticks: { color: "#8b949e", maxRotation: 0, autoSkipPadding: 20 },
          grid: { color: "#232a35" },
        },
        y: {
          min: 0, max: 100,
          title: { display: true, text: "GPU util %", color: "#8b949e" },
          ticks: { color: "#8b949e" },
          grid: { color: "#232a35" },
        },
      },
      plugins: {
        legend: { labels: { color: "#e6edf3", boxWidth: 12 } },
        tooltip: { backgroundColor: "#1c232c", borderColor: "#2a313c", borderWidth: 1 },
      },
    },
  });
  charts.push(c);
}

function buildUserMemChart(canvas, host, idxs, hours) {
  const tsAll = window._data.timestamps;
  const { xMin, xMax } = windowBounds(hours);
  const totalMB = (host.mem_total || []).reduce((a, b) => a + b, 0);

  // Sort users by total memory across the window (descending) so the biggest
  // user lives at the bottom of the stack and "unused" sits on top.
  const totalsByUser = {};
  idxs.forEach(i => {
    const um = host.user_mem[i] || {};
    for (const [u, v] of Object.entries(um)) {
      totalsByUser[u] = (totalsByUser[u] || 0) + v;
    }
  });
  const users = Object.keys(totalsByUser)
    .sort((a, b) => totalsByUser[b] - totalsByUser[a]);

  const userPct = (u, i) => {
    if (!totalMB) return 0;
    return ((host.user_mem[i] || {})[u] || 0) / totalMB * 100;
  };
  const tsMs = (i) => new Date(tsAll[i]).getTime();

  const datasets = users.map(u => ({
    label: u,
    data: idxs.map(i => ({ x: tsMs(i), y: userPct(u, i) })),
    backgroundColor: userColor(u, 0.55),
    borderColor: userColor(u, 0.95),
    borderWidth: 1,
    pointRadius: 0,
    tension: 0.3,
    fill: true,
    spanGaps: true,
  }));
  // unused = remaining headroom up to 100%
  datasets.push({
    label: "unused",
    data: idxs.map(i => {
      const um = host.user_mem[i] || {};
      const used = Object.values(um).reduce((a, b) => a + b, 0);
      const free = totalMB ? Math.max(0, 100 - used / totalMB * 100) : 100;
      return { x: tsMs(i), y: free };
    }),
    backgroundColor: `rgba(${UNUSED_COLOR_RGB}, 0.30)`,
    borderColor: `rgba(${UNUSED_COLOR_RGB}, 0.6)`,
    borderWidth: 1,
    pointRadius: 0,
    tension: 0.3,
    fill: true,
    spanGaps: true,
  });

  const c = new Chart(canvas, {
    type: "line",
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: false,
      interaction: { mode: "index", intersect: false },
      scales: {
        x: {
          type: "time",
          min: xMin, max: xMax,
          time: { tooltipFormat: "MMM d, HH:mm" },
          ticks: { color: "#8b949e", maxRotation: 0, autoSkipPadding: 20 },
          grid: { color: "#232a35" },
        },
        y: {
          stacked: true,
          min: 0, max: 100,
          title: { display: true, text: "Memory (% of host VRAM)", color: "#8b949e" },
          ticks: {
            color: "#8b949e",
            callback: (v) => `${v}%`,
          },
          grid: { color: "#232a35" },
        },
      },
      plugins: {
        legend: { labels: { color: "#e6edf3", boxWidth: 12 } },
        tooltip: {
          backgroundColor: "#1c232c", borderColor: "#2a313c", borderWidth: 1,
          callbacks: {
            label: (ctx) => {
              const pct = ctx.parsed.y;
              const gib = pct / 100 * (totalMB / 1024);
              return `${ctx.dataset.label}: ${pct.toFixed(1)}% (${gib.toFixed(1)} GiB)`;
            },
          },
        },
      },
    },
  });
  charts.push(c);
}

function renderHost(host, idxs, hours) {
  const last = idxs[idxs.length - 1];
  const lastUtil = host.util[last] || [];
  const lastMem = host.mem_used[last] || [];
  const lastUsers = host.users_per_gpu[last] || [];
  const memTotal = host.mem_total || [];

  // window-averaged util per GPU
  const winAvg = [];
  for (let g = 0; g < host.num_gpus; g++) {
    winAvg.push(avg(idxs.map(i => host.util[i]?.[g])));
  }
  const overallAvg = avg(winAvg);

  // unique users in window
  const userSet = new Set();
  idxs.forEach(i => {
    (host.users_per_gpu[i] || []).forEach(uList => uList.forEach(u => userSet.add(u)));
  });

  const section = document.createElement("section");
  section.className = "host-section";
  section.innerHTML = `
    <div class="host-header">
      <h2>${host.host}</h2>
      <span class="stat">${host.num_gpus} GPUs · avg ${overallAvg == null ? "–" : overallAvg.toFixed(1) + "%"} util · ${userSet.size} users in window</span>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h3>GPU utilization (%)</h3>
        <div class="chart-wrap"><canvas></canvas></div>
      </div>
      <div class="panel">
        <h3>Memory usage by user</h3>
        <div class="chart-wrap"><canvas></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h3>Current state · ${fmtTs(window._data.timestamps[last])}</h3>
      <div class="gpu-grid"></div>
      <div class="legend"></div>
    </div>
  `;
  document.getElementById("main").appendChild(section);

  const [utilCanvas, memCanvas] = section.querySelectorAll("canvas");
  buildUtilChart(utilCanvas, host, idxs, hours);
  buildUserMemChart(memCanvas, host, idxs, hours);

  const grid = section.querySelector(".gpu-grid");
  for (let g = 0; g < host.num_gpus; g++) {
    const used = lastMem[g];
    const total = memTotal[g] || 0;
    const memPct = (used != null && total) ? (used / total * 100) : 0;
    const users = lastUsers[g] || [];
    const card = document.createElement("div");
    card.className = "gpu-card";
    card.innerHTML = `
      <div class="row"><strong>GPU ${g}</strong>
        <span style="color:${lastUtil[g] >= 50 ? '#f0883e' : '#8b949e'}">${lastUtil[g] ?? "–"}%</span>
      </div>
      <div class="util-bar"><span style="width:${lastUtil[g] ?? 0}%"></span></div>
      <div class="row" style="margin-top:6px"><span class="label">Memory</span>
        <span>${used != null ? (used/1024).toFixed(1) : "–"} / ${(total/1024).toFixed(0)} GiB (${memPct.toFixed(0)}%)</span>
      </div>
      <div class="users">
        ${users.length === 0
          ? '<span style="color:#6e7681;font-size:11px">idle</span>'
          : users.map(u => `<span class="user-chip" style="background:${userColor(u)}">${u}</span>`).join("")}
      </div>
    `;
    grid.appendChild(card);
  }

  const legend = section.querySelector(".legend");
  legend.innerHTML = [...userSet].sort().map(u =>
    `<span><span class="swatch" style="background:${userColor(u)}"></span>${u}</span>`
  ).join("");
}

// ---------- main render ----------
function render(hours) {
  destroyCharts();
  document.querySelectorAll("#rangeBtns .btn").forEach(b => {
    b.classList.toggle("active", parseInt(b.dataset.hours) === hours);
  });
  const main = document.getElementById("main");
  main.innerHTML = "";

  const idxs = filterRange(window._data, hours);
  if (idxs.length === 0) {
    main.innerHTML = `<div class="empty">No samples in the last ${rangeLabel(hours)}.</div>`;
    return;
  }
  window._data.hosts.forEach(host => renderHost(host, idxs, hours));
}

async function main() {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    window._data = data;
    document.getElementById("generatedAt").textContent =
      "updated " + fmtTs(data.generated_at);
    document.getElementById("intervalLabel").textContent =
      Math.round(data.interval_sec / 60);
    render(24);
  } catch (e) {
    document.getElementById("main").innerHTML =
      `<div class="empty">Failed to load data.json: ${e.message}</div>`;
  }
}

document.querySelectorAll("#rangeBtns .btn").forEach(b => {
  b.addEventListener("click", () => render(parseInt(b.dataset.hours)));
});
main();
</script>
</body>
</html>
